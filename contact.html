<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Contact Us | Food Waste Saver</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --primary: #1e3c72;
      --secondary: #2a5298;
      --accent: #00c6ff;
      --bg: #f5f7fa;
      --text-dark: #2e2e2e;
      --text-light: #666;
      --white: #fff;
    }

    body {
      font-family: 'Poppins', sans-serif;
      margin: 0;
      background: var(--bg);
    }

    .container {
      max-width: 1200px;
      margin: 3rem auto;
      padding: 2rem;
      background: var(--white);
      border-radius: 20px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.08);
      animation: fadeIn 1s ease;
    }

    h2 {
      text-align: center;
      color: var(--primary);
      font-weight: 600;
      margin-bottom: 2rem;
    }

    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 2rem;
    }

    form {
      display: flex;
      flex-direction: column;
    }

    input, textarea {
      padding: 14px;
      font-size: 1rem;
      border: 1px solid #ccc;
      border-radius: 8px;
      margin-bottom: 1rem;
      transition: border-color 0.3s ease;
    }

    input:focus, textarea:focus {
      outline: none;
      border-color: var(--secondary);
    }

    button {
      background: linear-gradient(to right, var(--primary), var(--secondary));
      color: var(--white);
      padding: 14px;
      border: none;
      border-radius: 30px;
      font-size: 1rem;
      cursor: pointer;
      font-weight: 500;
      transition: all 0.3s ease;
    }

    button:hover {
      background: linear-gradient(to right, var(--secondary), var(--primary));
      transform: scale(1.03);
    }

    .map iframe {
      width: 100%;
      height: 350px;
      border: none;
      border-radius: 12px;
    }

    .info {
      text-align: center;
      margin-top: 3rem;
      font-size: 1.1rem;
      line-height: 1.7;
      color: var(--text-light);
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(30px);}
      to { opacity: 1; transform: translateY(0);}
    }

    @media (max-width: 768px) {
      .form-grid {
        grid-template-columns: 1fr;
      }

      .map iframe {
        height: 300px;
      }
    }
  </style>
</head>
<body>

  <div class="container">
    <h2>Contact Us</h2>
    <div class="form-grid">
      <!-- Contact Form -->
      <form id="contactForm">
        <input type="text" id="name" placeholder="Your Name" required />
        <input type="email" id="email" placeholder="Your Email" required />
        <input type="text" id="subject" placeholder="Subject" required />
        <textarea id="message" rows="5" placeholder="Your Message" required></textarea>
        <button type="submit">Send Message</button>
      </form>

      <!-- Google Map -->
      <div class="map">
        <iframe 
          src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3571.780115938524!2d82.4892550104869!3d26.462815829184592!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x3990930022dbd311%3A0x5cdc5fd65878ddb1!2sShiv%20baba%20dham%20akbarpur!5e0!3m2!1sen!2sin!4v1743937581843!5m2!1sen!2sin" 
          allowfullscreen="" 
          loading="lazy" 
          referrerpolicy="no-referrer-when-downgrade">
        </iframe>
      </div>
    </div>

    <!-- Extra Info for Users -->
    <div class="info">
      <p><strong>Need help or want to partner with us to fight food waste?</strong></p>
      <p>Our team is happy to connect with users, restaurants, and organizations.</p>
      <p>Just drop a message — we usually respond within 24 hours.</p>
    </div>
  </div>

  <script>
    const contactForm = document.getElementById("contactForm");

    contactForm.addEventListener("submit", function (e) {
      e.preventDefault();
      alert("Thanks for contacting us! We will get back to you soon.");
      contactForm.reset();

      // TODO: Connect to Firebase/Backend to save the form data
    });
  </script>
</body>
</html>
