<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Register | Food Waste Saver</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet" />
  <style>
    body {
      font-family: 'Poppins', sans-serif;
      margin: 0;
      background: linear-gradient(to right, #83a4d4, #b6fbff);
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    .card {
      background: white;
      border-radius: 20px;
      padding: 2rem;
      box-shadow: 0 15px 30px rgba(0,0,0,0.1);
      width: 100%;
      max-width: 450px;
      animation: fadeIn 0.7s ease;
    }
    h2 {
      text-align: center;
      color: #333;
      margin-bottom: 1.2rem;
    }
    form {
      display: flex;
      flex-direction: column;
    }
    select, input {
      margin-bottom: 1rem;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 10px;
      font-size: 1rem;
      transition: border-color 0.3s ease;
    }
    input:focus, select:focus {
      border-color: #0072ff;
      outline: none;
    }
    .btn {
      background: linear-gradient(to right, #00c6ff, #0072ff);
      color: white;
      padding: 12px;
      border: none;
      border-radius: 25px;
      font-size: 1rem;
      cursor: pointer;
      transition: transform 0.3s;
    }
    .btn:hover {
      transform: scale(1.05);
    }
    .message {
      text-align: center;
      margin-top: 1rem;
      color: green;
    }
    .hidden {
      display: none;
    }
    @keyframes fadeIn {
      from {opacity: 0; transform: translateY(20px);}
      to {opacity: 1; transform: translateY(0);}
    }
  </style>
</head>
<body>

  <div class="card">
    <h2>Create Your Account</h2>

    <form id="registerForm">
      <select id="registerRole" required>
        <option value="">-- Select Role --</option>
        <option value="user">User</option>
        <option value="restaurant">Restaurant</option>
      </select>
      <input type="text" id="firstName" placeholder="First Name" required />
      <input type="text" id="lastName" placeholder="Last Name" required />
      <select id="gender" required>
        <option value="">-- Select Gender --</option>
        <option value="male">Male</option>
        <option value="female">Female</option>
        <option value="other">Other</option>
      </select>
      <input type="text" id="restaurantName" class="restaurant-field hidden" placeholder="Restaurant Name" />
      <input type="text" id="fssaiCode" class="restaurant-field hidden" placeholder="FSSAI Code" />
      <input type="tel" id="mobile" placeholder="Mobile Number" required />
      <input type="email" id="Email" placeholder="Email" required />
      <input type="password" id="Password" placeholder="Password (min 6 chars)" required />
      <input type="password" id="confirmPassword" placeholder="Confirm Password" required />
      <button type="submit" class="btn">Register</button>
    </form>

    <div class="message" id="message"></div>
  </div>

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/10.11.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.11.0/firebase-auth-compat.js"></script>

  <script>
    const firebaseConfig = {
      apiKey: "YOUR_API_KEY",
      authDomain: "YOUR_AUTH_DOMAIN",
      projectId: "YOUR_PROJECT_ID",
      appId: "YOUR_APP_ID"
    };
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();

    const form = document.getElementById("registerForm");
    const message = document.getElementById("message");
    const registerRole = document.getElementById("registerRole");
    const restaurantFields = document.querySelectorAll(".restaurant-field");

    // Show/hide restaurant fields
    registerRole.addEventListener("change", () => {
      if (registerRole.value === "restaurant") {
        restaurantFields.forEach(field => field.classList.remove("hidden"));
      } else {
        restaurantFields.forEach(field => field.classList.add("hidden"));
      }
    });

    // Register user
    form.addEventListener("submit", async (e) => {
      e.preventDefault();

      const email = document.getElementById("Email").value;
      const password = document.getElementById("Password").value;
      const password = document.getElementById("confirmPassword").value;
      const role = registerRole.value;

      if (!role) return message.textContent = "Please select a role.";
      if (Password !== confirmPassword) 

       
       return message.textContent = "Passwords do not match.";

      try {
        await auth.createUserWithEmailAndPassword(email, password);
        message.textContent = "Registration Successful! Redirecting...";

        setTimeout(() => {
          window.location.href = role === "restaurant" ? "restaurant-dashboard.html" : "user-dashboard.html";
        }, 3000);
      } catch (err) {
        message.textContent = err.message;
      }
    });
  </script>
</body>
</html>
