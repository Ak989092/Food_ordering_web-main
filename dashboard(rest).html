<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Restaurant Dashboard | Food Waste Saver</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet" />
  <style>
    body {
      margin: 0;
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(to right, #ffffff, #e6f0ff);
      min-height: 100vh;
    }

    .dashboard {
      max-width: 1100px;
      margin: 3rem auto;
      background: #ffffff;
      border-radius: 25px;
      padding: 2.5rem;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
      animation: fadeIn 0.8s ease-in-out;
    }

    h2 {
      text-align: center;
      margin-bottom: 2rem;
      color: #004080;
    }

    form {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1.2rem;
      margin-bottom: 2.5rem;
    }

    form input, form textarea {
      padding: 12px;
      border: 1px solid #ccd9ff;
      border-radius: 12px;
      font-size: 1rem;
      background: #f4f8ff;
    }

    form textarea {
      grid-column: span 2;
      resize: none;
      height: 90px;
    }

    form button {
      grid-column: span 2;
      background: linear-gradient(to right, #0072ff, #00c6ff);
      color: white;
      padding: 14px;
      border: none;
      border-radius: 30px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    form button:hover {
      transform: scale(1.05);
      background: linear-gradient(to right, #0052cc, #0099ff);
    }

    .items {
      margin-top: 2rem;
    }

    .card {
      display: flex;
      background: #f9fbff;
      border-radius: 20px;
      margin-bottom: 1.5rem;
      overflow: hidden;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.05);
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .card:hover {
      transform: scale(1.02);
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.1);
    }

    .card img {
      width: 180px;
      object-fit: cover;
    }

    .card-content {
      padding: 1.2rem;
      flex: 1;
    }

    .card-content h4 {
      margin: 0;
      color: #003366;
    }

    .card-content p {
      font-size: 0.95rem;
      color: #555;
      margin: 0.5rem 0;
    }

    .logout {
      display: flex;
      justify-content: flex-end;
      margin-bottom: 1rem;
    }

    .logout button {
      background: #ff4d4d;
      border: none;
      color: white;
      padding: 10px 22px;
      border-radius: 25px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.3s ease;
    }

    .logout button:hover {
      background: #cc0000;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(30px);}
      to { opacity: 1; transform: translateY(0);}
    }
  </style>
</head>
<body>
  <div class="dashboard">
    <div class="logout">
      <button onclick="logout()">Logout</button>
    </div>
    <h2>Welcome to Your Restaurant Dashboard</h2>

    <form id="foodForm">
      <input type="text" placeholder="Dish Name" required />
      <input type="number" placeholder="Original Price (₹)" required />
      <input type="number" placeholder="Discounted Price (₹)" required />
      <input type="number" placeholder="Quantity Available" required />
      <input type="file" accept="image/*" required />
      <textarea placeholder="Add description about the food... (optional)"></textarea>
      <button type="submit">Post Leftover Food</button>
    </form>

    <div class="items" id="foodItems">
      <!-- Posted food items will appear here -->
    </div>
  </div>

  <script>
    const form = document.getElementById("foodForm");
    const foodItems = document.getElementById("foodItems");

    form.addEventListener("submit", function(e) {
      e.preventDefault();
      const inputs = form.querySelectorAll("input, textarea");
      const imgFile = inputs[4].files[0];
      const reader = new FileReader();

      reader.onload = function() {
        const card = document.createElement("div");
        card.className = "card fadeIn";
        card.innerHTML = `
          <img src="${reader.result}" alt="Dish Image" />
          <div class="card-content">
            <h4>${inputs[0].value}</h4>
            <p><b>Original:</b> ₹${inputs[1].value}</p>
            <p><b>Now:</b> ₹${inputs[2].value}</p>
            <p><b>Qty:</b> ${inputs[3].value}</p>
            <p>${inputs[5].value}</p>
          </div>
        `;
        foodItems.appendChild(card);
        form.reset();
      };

      if (imgFile) {
        reader.readAsDataURL(imgFile);
      }
    });

    function logout() {
      window.location.href = "index.html";
    }
  </script>
</body>
</html>
